name: Runbook drill

on:
  workflow_dispatch:

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - name: Log drill marker A17 and signal completion
        run: |
          echo "DRILL-LOG-MARKER-A17"
          echo "quick job done"

  long-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Hold the line for a while
        run: sleep 1800
